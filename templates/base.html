<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Vantage{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <header class="app-header">

        <div class="nav-container">

            <a
                href="{{ url_for('home') }}"
                class="brand"
            >
                <span class="brand-mark">
                    V
                </span>

                <span class="brand-name">
                    Vantage
                </span>
            </a>


            <nav class="main-nav">

                <a
                    href="{{ url_for('home') }}"
                    class="{% if request.path == '/' %}active{% endif %}"
                >
                    News
                </a>

                <a
                    href="{{ url_for('funding') }}"
                    class="{% if request.path.startswith('/funding') %}active{% endif %}"
                >
                    Funding
                </a>

                <a
                    href="{{ url_for('intelligence') }}"
                    class="{% if request.path.startswith('/intelligence') %}active{% endif %}"
                >
                    Intelligence
                </a>

                <a
                    href="{{ url_for('sources') }}"
                    class="{% if request.path.startswith('/sources') %}active{% endif %}"
                >
                    Sources
                </a>

                <a
                    href="{{ url_for('data_quality') }}"
                    class="{% if request.path.startswith('/data-quality') %}active{% endif %}"
                >
                    Data Quality
                </a>

            </nav>


            <div class="system-status">
                <span class="status-dot"></span>
                Knowledge base online
            </div>

        </div>

    </header>


    <main class="page-shell">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="app-footer">

        <div>
            Vantage
        </div>

        <div>
            Venture ecosystem intelligence
        </div>

    </footer>

</body>

</html>

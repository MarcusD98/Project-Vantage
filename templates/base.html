<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Vantage{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <header class="app-header">

        <div class="nav-container">

            <a
                href="{{ url_for('home') }}"
                class="brand"
            >
                <span class="brand-mark">
                    V
                </span>

                <span class="brand-name">
                    Vantage
                </span>
            </a>


            <nav class="main-nav" aria-label="Primary navigation">

                <a
                    href="{{ url_for('home') }}"
                    class="{% if request.path == '/' or request.path.startswith('/intelligence') %}active{% endif %}"
                >
                    Intelligence
                </a>

                <a
                    href="{{ url_for('investors') }}"
                    class="{% if request.path.startswith('/investor') %}active{% endif %}"
                >
                    Investors
                </a>

                <a
                    href="{{ url_for('companies') }}"
                    class="{% if request.path.startswith('/compan') %}active{% endif %}"
                >
                    Companies
                </a>

                <a
                    href="{{ url_for('funding') }}"
                    class="{% if request.path.startswith('/funding') %}active{% endif %}"
                >
                    Funding
                </a>

                <a
                    href="{{ url_for('evidence') }}"
                    class="{% if request.path.startswith('/evidence') %}active{% endif %}"
                >
                    Evidence
                </a>

                <details
                    class="system-menu {% if request.path.startswith('/sources') or request.path.startswith('/data-quality') %}active{% endif %}"
                >
                    <summary>
                        System
                    </summary>

                    <div class="system-menu-panel">
                        <a
                            href="{{ url_for('sources') }}"
                            class="{% if request.path.startswith('/sources') %}active{% endif %}"
                        >
                            Source coverage
                        </a>

                        <a
                            href="{{ url_for('data_quality') }}"
                            class="{% if request.path.startswith('/data-quality') %}active{% endif %}"
                        >
                            Data quality
                        </a>
                    </div>
                </details>

            </nav>


            <div class="system-status">
                <span class="status-dot"></span>
                Knowledge base online
            </div>

        </div>

    </header>


    <main class="page-shell">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="app-footer">

        <div>
            Vantage
        </div>

        <div>
            Venture ecosystem intelligence
        </div>

    </footer>

</body>

</html>

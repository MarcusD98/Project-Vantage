<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Vantage
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>


<body>

    <header class="site-header">

        <div class="header-inner">

            <a
                href="{{ url_for('home') }}"
                class="brand"
            >
                <div class="brand-mark">
                    V
                </div>

                <div class="brand-text">
                    <div class="brand-name">
                        Vantage
                    </div>

                    <div class="brand-subtitle">
                        Venture Intelligence
                    </div>
                </div>
            </a>


            <nav class="main-nav">

                <a
                    href="{{ url_for('home') }}"
                    class="{% if request.path == '/' %}active{% endif %}"
                >
                    News
                </a>

                <a
                    href="{{ url_for('funding') }}"
                    class="{% if request.path.startswith('/funding') %}active{% endif %}"
                >
                    Funding
                </a>

                <a
                    href="{{ url_for('sources') }}"
                    class="{% if request.path.startswith('/sources') %}active{% endif %}"
                >
                    Sources
                </a>

                <a
                    href="{{ url_for('data_quality') }}"
                    class="{% if request.path.startswith('/data-quality') %}active{% endif %}"
                >
                    Data Quality
                </a>

            </nav>

        </div>

    </header>


    <main class="page-shell">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="site-footer">

        <div class="footer-inner">

            <div>
                Vantage
            </div>

            <div class="footer-meta">
                Venture ecosystem intelligence
            </div>

        </div>

    </footer>

</body>

</html>

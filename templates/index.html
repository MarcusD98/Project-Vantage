<!DOCTYPE html>
<html>
<head>
    <title>VC News Aggregator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>VC News Aggregator</h1>

        <form method="GET">
            <input
                type="text"
                name="q"
                placeholder="Search articles..."
                value= "{{ search_query }}"
            >

            <select name="source">
                <option value="">All sources</option>

                <option
                    value="TechCrunch"
                    {% if source_filter == "TechCrunch"%}selected{% endif %}
                >
                    TechCrunch
                </option>

                <option 
                    value="Sifted"
                    {% if source_filter == "Sifted"%}selected{% endif %}
                >
                    Sifted
                </option>

            </select>

            <button type="submit">
                Search
            </button>
        </form>

        <div class="article-grid">
            {% for article in articles %}
                <article class="article-card">
                    <span class="source-badge">
                        {{ article.source }}
                    </span>

                    <h2>{{ article.title }}</h2>

                    <p class="date">
                        {{ article.published_at }}
                    </p>

                    <a href="{{ article.url }}" target="_blank">
                        Read article
                    </a>
                </article>
            {% endfor %}
        </div>
    </div>

</body>
</html>
